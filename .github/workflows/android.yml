name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the GitHub release on pushes to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The legacy "tools" package (the action's default) no longer exists in recent
      # cmdline-tools: only ask for platform-tools; Gradle fetches the platforms it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Uses the Gradle installed above (no committed gradle-wrapper.jar needed).
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Same release key for every build, so a new APK installs over the previous one.
      - name: Restore the release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key secret: the APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "AnimeReader-5.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeReader-apk
          path: AnimeReader-5.*.apk
          if-no-files-found: error

      # Every merge into main becomes a downloadable release (Releases page of the repository).
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v5.${GITHUB_RUN_NUMBER}" "AnimeReader-5.${GITHUB_RUN_NUMBER}.apk" \
            --title "AnimeReader 5.${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%B)" --latest

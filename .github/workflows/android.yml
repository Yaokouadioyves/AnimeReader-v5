name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The legacy "tools" package (the action's default) no longer exists in recent
      # cmdline-tools: only ask for platform-tools; Gradle fetches the platforms it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Uses the Gradle installed above (no committed gradle-wrapper.jar needed).
      - name: Unit tests (token + de-dup logic)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeReader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

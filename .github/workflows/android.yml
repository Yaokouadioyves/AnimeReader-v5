name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the GitHub release on pushes to main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Offline voice: Gradium's Phonon runtime (github.com/gradium-ai/xn-ptts) and the model files.
      PTTS_VERSION: v0.4.0
      PHONON_MODEL_RELEASE: phonon-fr-40m-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The legacy "tools" package (the action's default) no longer exists in recent
      # cmdline-tools: only ask for platform-tools; Gradle fetches the platforms it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # libptts_ffi.so has no prebuilt Android package: build it (arm64, same flags as the
      # project's android/build.sh) once per Phonon version and keep it in the cache.
      - name: Restore the Phonon native library
        id: phonon-lib
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs
          key: ptts-ffi-${{ env.PTTS_VERSION }}-arm64-dotprod-fp16

      - name: Build the Phonon native library
        if: steps.phonon-lib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PTTS_VERSION" https://github.com/gradium-ai/xn-ptts.git "$RUNNER_TEMP/xn-ptts"
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          # Replace the repository's target-cpu=native (the build machine) with the phone's features.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C strip=symbols -C link-arg=-Wl,-z,max-page-size=16384 -C target-cpu=generic -C target-feature=+dotprod,+fp16"
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          cd "$RUNNER_TEMP/xn-ptts"
          cargo ndk -t arm64-v8a -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" build --release -p ptts-ffi
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

      # Saved right away, so a later failing step doesn't throw the ~2 min build away.
      - name: Save the Phonon native library
        if: steps.phonon-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs
          key: ${{ steps.phonon-lib.outputs.cache-primary-key }}

      # Phonon 40m French + the Augustin and Noémie voices (© Gradium, CC BY-NC 4.0), hosted
      # unmodified on a pre-release of this repository (the Hugging Face repo needs a login).
      - name: Fetch the Phonon model
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${PHONON_MODEL_RELEASE}"
          tmp="$RUNNER_TEMP/phonon"; mkdir -p "$tmp"
          for f in config.json tokenizer.json model.q8.gguf voice-Augustin.safetensors voice-Noemie.safetensors SHA256SUMS; do
            curl -fsSL --retry 3 -o "$tmp/$f" "$base/$f"
          done
          (cd "$tmp" && sha256sum -c SHA256SUMS)
          d=app/src/main/assets/phonon
          mkdir -p "$d/voices"
          mv "$tmp/config.json" "$tmp/tokenizer.json" "$tmp/model.q8.gguf" "$d/"
          mv "$tmp/voice-Augustin.safetensors" "$d/voices/Augustin.safetensors"
          mv "$tmp/voice-Noemie.safetensors" "$d/voices/Noemie.safetensors"
          ls -laR "$d"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Uses the Gradle installed above (no committed gradle-wrapper.jar needed).
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Same release key for every build, so a new APK installs over the previous one.
      - name: Restore the release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key secret: the APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "AnimeReader-5.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeReader-apk
          path: AnimeReader-5.*.apk
          if-no-files-found: error

      # Every merge into main becomes a downloadable release (Releases page of the repository).
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v5.${GITHUB_RUN_NUMBER}" "AnimeReader-5.${GITHUB_RUN_NUMBER}.apk" \
            --title "AnimeReader 5.${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%B)" --latest
